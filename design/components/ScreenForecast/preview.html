<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap"><style>*{box-sizing:border-box}
body{margin:0;padding:20px 16px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:12px;line-height:14px;color:var(--ink-muted);text-align:center}
.disc{position:relative;width:240px;height:240px;border-radius:50%;background:var(--bg);overflow:hidden;flex:none}
.disc>svg{position:absolute;left:0;top:0;width:240px;height:240px}
.abs{position:absolute;left:0;width:240px;text-align:center;white-space:nowrap;margin:0}
.trk{fill:none;stroke:var(--track);stroke-width:10;stroke-linecap:round}
.ind{fill:none;stroke:var(--st);stroke-width:10;stroke-linecap:round}
.s-ok{--st:var(--ok)}.s-warn{--st:var(--warn)}.s-danger{--st:var(--danger)}.s-off{--st:var(--ink-muted)}.s-acc{--st:var(--accent)}
.stat{display:inline-flex;align-items:center;gap:6px;color:var(--st);font-size:14px;line-height:16px}
.stat svg{flex:none}
.dots{display:inline-flex;align-items:center;gap:8px;line-height:0}
.dots i{display:block;width:8px;height:8px;border-radius:999px;background:var(--line)}
.dots i.on{width:18px;background:var(--ink)}
</style></head><body><div class="row"><div class="cell"><div class="disc"><svg viewBox="0 0 240 240"><path d="M93 68V168M147 68V168" stroke="var(--track)" stroke-width="2" stroke-linecap="round"/></svg><div class="abs label" style="top:30px;color:var(--ink-muted);">3 days</div><div style="position:absolute;left:41px;width:50px;text-align:center;top:60px"><div class="label" style="color:var(--ink-muted)">Today</div><div style="height:32px;margin-top:6px;line-height:0"><svg width="32" height="32" viewBox="0 0 48 48" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(1 -6)"><path d="M13 36h20a7 7 0 0 0 .9-13.94A10 10 0 0 0 14.6 20.6 7.7 7.7 0 0 0 13 36Z"/></g><path d="M16 38l-2 6M24 38l-2 6M32 38l-2 6"/></svg></div><div class="title" style="color:var(--ink);margin-top:6px">16°</div><div class="label" style="color:var(--ink-muted)">9°</div></div><div style="position:absolute;left:95px;width:50px;text-align:center;top:60px"><div class="label" style="color:var(--ink-muted)">Tue</div><div style="height:32px;margin-top:6px;line-height:0"><svg width="32" height="32" viewBox="0 0 48 48" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(1 0)"><path d="M13 36h20a7 7 0 0 0 .9-13.94A10 10 0 0 0 14.6 20.6 7.7 7.7 0 0 0 13 36Z"/></g></svg></div><div class="title" style="color:var(--ink);margin-top:6px">14°</div><div class="label" style="color:var(--ink-muted)">8°</div></div><div style="position:absolute;left:149px;width:50px;text-align:center;top:60px"><div class="label" style="color:var(--ink-muted)">Wed</div><div style="height:32px;margin-top:6px;line-height:0"><svg width="32" height="32" viewBox="0 0 48 48" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="17" r="6.5"/><path d="M9.2 24.8L6.4 27.6M6.0 17.0L2.0 17.0M9.2 9.2L6.4 6.4M17.0 6.0L17.0 2.0M24.8 9.2L27.6 6.4"/><g transform="translate(9 12) scale(.8)"><path d="M13 36h20a7 7 0 0 0 .9-13.94A10 10 0 0 0 14.6 20.6 7.7 7.7 0 0 0 13 36Z" fill="var(--bg)"/></g></svg></div><div class="title" style="color:var(--ink);margin-top:6px">17°</div><div class="label" style="color:var(--ink-muted)">7°</div></div></div><div class="cap">Forecast. Press from Weather. Long press: back.</div></div></div></body></html>
