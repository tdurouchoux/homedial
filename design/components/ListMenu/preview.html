<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap"><style>*{box-sizing:border-box}
body{margin:0;padding:20px 16px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:12px;line-height:14px;color:var(--ink-muted);text-align:center}
.disc{position:relative;width:240px;height:240px;border-radius:50%;background:var(--bg);overflow:hidden;flex:none}
.disc>svg{position:absolute;left:0;top:0;width:240px;height:240px}
.abs{position:absolute;left:0;width:240px;text-align:center;white-space:nowrap;margin:0}
.trk{fill:none;stroke:var(--track);stroke-width:10;stroke-linecap:round}
.ind{fill:none;stroke:var(--st);stroke-width:10;stroke-linecap:round}
.s-ok{--st:var(--ok)}.s-warn{--st:var(--warn)}.s-danger{--st:var(--danger)}.s-off{--st:var(--ink-muted)}.s-acc{--st:var(--accent)}
.stat{display:inline-flex;align-items:center;gap:6px;color:var(--st);font-size:14px;line-height:16px}
.stat svg{flex:none}
.dots{display:inline-flex;align-items:center;gap:8px;line-height:0}
.dots i{display:block;width:8px;height:8px;border-radius:999px;background:var(--line)}
.dots i.on{width:18px;background:var(--ink)}
</style></head><body><div class="row"><div class="cell"><div class="disc"><svg viewBox="0 0 240 240"><path class="trk" d="M216.1 64.5A111 111 0 0 1 216.1 175.5"/><path class="ind s-acc" d="M222.2 76.6A111 111 0 0 1 230.2 106.5"/></svg><div class="abs title" style="top:48px;color:var(--ink);opacity:var(--opa-dim)">Units</div><div class="abs title" style="top:150px;color:var(--ink);opacity:var(--opa-dim)">Display</div><div style="position:absolute;left:32px;top:98px;width:176px;height:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:space-between;padding:0 16px" class="title"><span>Alerts</span><span class="label">On</span></div></div><div class="cap">Navigate: focused row on accent, neighbours at opa-dim</div></div><div class="cell"><div class="disc"><div class="abs title" style="top:48px;color:var(--ink);opacity:var(--opa-dim)">Time</div><div style="position:absolute;left:32px;top:98px;width:176px;height:44px;border-radius:12px;background:var(--surface-2);border:2px solid var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 12px" class="title"><span>Units</span><span style="display:inline-flex;gap:6px;align-items:center"><svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1 1.5 6 6 11"/></svg><span class="label">°C</span><svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1l4.5 5L2 11"/></svg></span></div><div class="abs title" style="top:150px;color:var(--ink);opacity:var(--opa-dim)">Alerts</div><div class="abs label" style="top:184px;color:var(--ink-muted);">Press to save</div></div><div class="cap">Edit: border accent, chevrons around value</div></div></div></body></html>
