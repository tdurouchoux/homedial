<!-- @dsCard group="Status and navigation" height=110 width=720 subtitle="glyph + word in the state colour" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap"><style>*{box-sizing:border-box}
body{margin:0;padding:20px 16px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:12px;line-height:14px;color:var(--ink-muted);text-align:center}
.disc{position:relative;width:240px;height:240px;border-radius:50%;background:var(--bg);overflow:hidden;flex:none}
.disc>svg{position:absolute;left:0;top:0;width:240px;height:240px}
.abs{position:absolute;left:0;width:240px;text-align:center;white-space:nowrap;margin:0}
.trk{fill:none;stroke:var(--track);stroke-width:10;stroke-linecap:round}
.ind{fill:none;stroke:var(--st);stroke-width:10;stroke-linecap:round}
.s-ok{--st:var(--ok)}.s-warn{--st:var(--warn)}.s-danger{--st:var(--danger)}.s-off{--st:var(--ink-muted)}.s-acc{--st:var(--accent)}
.stat{display:inline-flex;align-items:center;gap:6px;color:var(--st);font-size:14px;line-height:16px}
.stat svg{flex:none}
.dots{display:inline-flex;align-items:center;gap:8px;line-height:0}
.dots i{display:block;width:8px;height:8px;border-radius:999px;background:var(--line)}
.dots i.on{width:18px;background:var(--ink)}
.chip2{background:var(--bg);padding:16px 22px;border-radius:12px}</style></head><body><div class="row"><div class="cell"><div class="chip2"><span class="stat s-ok"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="var(--st)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 5 9.5 10.5 3"/></svg><span>OK</span></span></div><div class="cap">OK: in range</div></div><div class="cell"><div class="chip2"><span class="stat s-warn"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1.2 11.2 10.6H0.8Z" fill="var(--st)" stroke="var(--st)" stroke-width="1" stroke-linejoin="round"/></svg><span>WARN</span></span></div><div class="cap">WARN: near limit</div></div><div class="cell"><div class="chip2"><span class="stat s-danger"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="var(--st)" stroke-width="2" stroke-linecap="round"><path d="M2 2 10 10M10 2 2 10"/></svg><span>ALERT</span></span></div><div class="cap">ALERT: beyond limit</div></div><div class="cell"><div class="chip2"><span class="stat s-off"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="var(--st)" stroke-width="2"><circle cx="6" cy="6" r="4" stroke-dasharray="3 2.2"/></svg><span>OFFLINE</span></span></div><div class="cap">OFFLINE: no data</div></div></div></body></html>
