<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap"><style>*{box-sizing:border-box}
body{margin:0;padding:20px 16px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:12px;line-height:14px;color:var(--ink-muted);text-align:center}
.disc{position:relative;width:240px;height:240px;border-radius:50%;background:var(--bg);overflow:hidden;flex:none}
.disc>svg{position:absolute;left:0;top:0;width:240px;height:240px}
.abs{position:absolute;left:0;width:240px;text-align:center;white-space:nowrap;margin:0}
.trk{fill:none;stroke:var(--track);stroke-width:10;stroke-linecap:round}
.ind{fill:none;stroke:var(--st);stroke-width:10;stroke-linecap:round}
.s-ok{--st:var(--ok)}.s-warn{--st:var(--warn)}.s-danger{--st:var(--danger)}.s-off{--st:var(--ink-muted)}.s-acc{--st:var(--accent)}
.stat{display:inline-flex;align-items:center;gap:6px;color:var(--st);font-size:14px;line-height:16px}
.stat svg{flex:none}
.dots{display:inline-flex;align-items:center;gap:8px;line-height:0}
.dots i{display:block;width:8px;height:8px;border-radius:999px;background:var(--line)}
.dots i.on{width:18px;background:var(--ink)}
.chip3{background:var(--bg);border-radius:12px;padding:16px 22px;min-width:170px;text-align:center}.stack{display:flex;flex-direction:column;align-items:center}.t{border-collapse:collapse;font-size:14px;line-height:18px;color:var(--ink);margin-top:6px}.t th,.t td{text-align:left;padding:4px 18px 4px 0;border-bottom:1px solid var(--line)}.t th{font-weight:400;color:var(--ink-muted)}</style></head><body><div class="row"><div class="cell"><div class="chip3"><div class="stack"><div class="body" style="color:var(--ink);display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 7V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1M2 8.5a1 1 0 0 1 2 0V10h8V8.5a1 1 0 0 1 2 0V12H2zM4 12v1.5M12 12v1.5"/></svg><span>Living room</span></div><div class="label" style="color:var(--ink-muted)">Temperature</div></div></div><div class="cap">Sensor page, with icon</div></div><div class="cell"><div class="chip3"><div class="stack"><div class="body" style="color:var(--ink);display:flex;align-items:center;gap:6px"><span>Bedroom</span></div><div class="label" style="color:var(--ink-muted)">Humidity</div></div></div><div class="cap">No icon: name centred</div></div><div class="cell"><div class="chip3"><div class="stack"><div class="body" style="color:var(--ink);display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M2 3v10M2 10.5h12.5V13M14.5 10.5V9A2 2 0 0 0 12.5 7H8v3.5"/><circle cx="5.4" cy="7.4" r="1"/></svg><span>Master bedr...</span></div><div class="label" style="color:var(--ink-muted)">CO2</div></div></div><div class="cap">Over 12 characters: ellipsis</div></div><div class="cell"><div class="chip3"><div class="label" style="color:var(--ink);display:flex;align-items:center;gap:6px;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 7.5h10v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM1.5 7.5h13M6 2.5c0 1 1 1 1 2M9.5 2.5c0 1 1 1 1 2"/></svg><span>Kitchen</span></div></div><div class="cap">Room page: label, ink</div></div></div><div class="row" style="margin-top:18px"><table class="t"><tr><th>Screen</th><th>Room style</th><th>Top</th></tr><tr><td>Sensor</td><td>body, ink</td><td>44</td></tr><tr><td>Room</td><td>label, ink</td><td>30</td></tr><tr><td>History</td><td>body, ink</td><td>28</td></tr><tr><td>Alert</td><td>label, ink-muted, no icon</td><td>126</td></tr></table></div></body></html>
