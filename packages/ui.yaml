# dial_ui external component (components/dial_ui). Data wiring per contract.md.
# Thresholds default to spec.md "Data decisions"; override them per metric here,
# or per room under a metric's `thresholds:`.
dial_ui:
  id: ui
  time_id: ha_time   # wall clock for history (packages/hardware.yaml)
  # Settings targets (packages/hardware.yaml): luminosity, encoder tick, Power off (HOLD).
  backlight: display_backlight
  buzzer: buzzer
  power_hold: power_hold
  rooms:
    - id: living
      name: Living room
      icon: living_room   # optional: living_room, bedroom, kitchen, bathroom, office, garage, garden, other
      metrics:
        - metric: temperature
          sensor: living_room_temperature
          history: true
        - metric: humidity
          sensor: living_room_humidity
          history: true
        - metric: air_quality
          sensor: living_room_iaq
          history: true
    - id: kitchen   # PLACEHOLDER room: check the sensors in packages/ha_entities.yaml
      name: Kitchen
      icon: kitchen
      metrics:
        - metric: temperature
          sensor: kitchen_temperature
          history: true
        - metric: humidity
          sensor: kitchen_humidity
          history: true
  # History backfill (contract.md §5.2): at boot and on each reconnect, the closed hours of the
  # last 24 h come from HA's hourly statistics (sensors with a state_class). `ids` lists the
  # history sensors' entity ids. Needs "Allow the device to perform Home Assistant actions".
  on_history_request:
    - homeassistant.action:
        action: recorder.get_statistics
        data:
          period: hour
          types: mean
        variables:
          ids: !lambda return ids;
        data_template:
          statistic_ids: "{{ ids.split(',') }}"
          start_time: "{{ (now() - timedelta(hours=25)).isoformat() }}"
        capture_response: true
        # Compact the answer to [["sensor.x", [[hour_epoch, mean], ...]], ...].
        response_template: >-
          [{%- for id, rows in response.statistics.items() -%}
          ["{{ id }}",[{%- for r in rows if r.mean is not none -%}
          [{{ as_timestamp(r.start) | int }},{{ r.mean | round(2) }}]{{ ',' if not loop.last }}
          {%- endfor -%}]]{{ ',' if not loop.last }}
          {%- endfor -%}]
        on_success:
          - lambda: id(ui).load_history(response["response"]);
        on_error:
          - lambda: id(ui).history_request_failed(error);
  power:
    sensor: power_now
    contract_limit: 6000W   # 6 kVA contract (spec.md); WARN from 80 %, ALERT from 100 %
    # Energy today: child page of Electricity (press / swipe up). Hourly kWh bars from HA's
    # statistics of the cumulative counter (kWh, state_class total_increasing). Fetched at
    # connect and once an hour. Needs "Allow the device to perform Home Assistant actions".
    energy:
      sensor: energy_total
      on_request:
        - homeassistant.action:
            action: recorder.get_statistics
            data:
              period: hour
            variables:
              ids: !lambda return ids;
            data_template:
              types: "{{ ['change', 'state'] }}"
              statistic_ids: "{{ ids.split(',') }}"
              # Today 00:00 local is at most 24 h (+1 h on a DST day) before now.
              start_time: "{{ (now() - timedelta(hours=26)).isoformat() }}"
            capture_response: true
            # Compact the answer to [[hour_epoch, change_kwh, end_counter_or_null], ...].
            response_template: >-
              [{%- for rows in response.statistics.values() -%}
              {%- for r in rows if r.change is not none -%}
              [{{ as_timestamp(r.start) | int }},{{ r.change | round(3) }},{{ r.state | round(3) if r.state is not none else 'null' }}]{{ ',' if not loop.last }}
              {%- endfor -%}
              {%- endfor -%}]
            on_success:
              - lambda: id(ui).load_energy(response["response"]);
            on_error:
              - lambda: id(ui).energy_request_failed(error);
  weather:
    temperature: outdoor_temperature
    condition: weather_condition
    rain_forecast: rain_next_hour
    rain_forecast_time: rain_next_hour_time
    # Hourly forecast (contract.md §6). Needs "Allow the device to perform Home Assistant
    # actions" in the device's ESPHome integration options in HA.
    on_forecast_request:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${weather_entity}   # set in homedial.yaml (substitutions)
            type: hourly
          capture_response: true
          # Compact the answer to [[epoch, "condition", temperature], ...] (24 rows).
          response_template: >-
            [{%- for f in ((response.values() | list | first).forecast[:24]) if f.temperature is not none -%}
            [{{ as_timestamp(f.datetime) | int }},"{{ f.condition or '' }}",{{ f.temperature | round(1) }}]{{ ',' if not loop.last }}
            {%- endfor -%}]
          on_success:
            - lambda: id(ui).load_forecast(response["response"]);
          on_error:
            - lambda: id(ui).forecast_request_failed(error);
