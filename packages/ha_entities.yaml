# Home Assistant entities read by the UI. PLACEHOLDER ids: replace with your own entities.
sensor:
  - platform: homeassistant
    id: living_room_temperature
    entity_id: sensor.livingroom_temperature
  - platform: homeassistant
    id: living_room_humidity
    entity_id: sensor.livingroom_humidity
  - platform: homeassistant
    id: living_room_iaq
    entity_id: sensor.livingroom_air_quality_index   # BME688 BSEC IAQ index (0 to 500)
  # Kitchen: PLACEHOLDER ids, replace with your entities.
  - platform: homeassistant
    id: kitchen_temperature
    entity_id: sensor.kitchen_temperature
  - platform: homeassistant
    id: kitchen_humidity
    entity_id: sensor.kitchen_humidity
  - platform: homeassistant
    id: kitchen_iaq
    entity_id: sensor.kitchen_air_quality_index   # BME688 BSEC IAQ index (0 to 500)

# Météo-France (spec.md "Weather"). PLACEHOLDER ids: replace `weather.home` and
# `sensor.home_next_rain` with your entities (Settings > Entities in Home Assistant).
  - platform: homeassistant
    id: outdoor_temperature
    entity_id: weather.home
    attribute: temperature

text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.home
  - platform: homeassistant
    id: rain_next_hour
    entity_id: sensor.home_next_rain
    attribute: 1_hour_forecast
  - platform: homeassistant
    id: rain_next_hour_time
    entity_id: sensor.home_next_rain
    attribute: forecast_time_ref
