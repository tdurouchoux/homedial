# M5Stack Dial: ESPHome + custom LVGL UI (dial_ui). See CLAUDE.md, spec.md, contract.md.

substitutions:
  # Météo-France entities in Home Assistant, used by packages/ha_entities.yaml (weather now,
  # next-hour rain) and packages/ui.yaml (hourly forecast action). Set them once here.
  weather_entity: weather.paris_11eme_arrondissement
  next_rain_entity: sensor.paris_11eme_arrondissement_next_rain
  # Live power in W (Electricity page). PLACEHOLDER: replace with your entity.
  power_entity: sensor.linky_apparent_power
  # Cumulative energy counter in kWh (total_increasing), for Energy today. PLACEHOLDER: replace
  # with your entity (the meter used by the Energy dashboard).
  energy_entity: sensor.linky_energy

esphome:
  name: homedial
  friendly_name: homedial
  build_flags:
    # LVGL features used only from dial_ui C++ (ESPHome sets unused LV_USE_* to 0, see contract.md §8).
    - -DLV_USE_ARC=1
    - -DLV_USE_LABEL=1
    - -DLV_USE_FLEX=1
    - -DLV_USE_CHART=1   # History TrendChart
    - -DLV_USE_LINE=1    # dashed limit line on the chart
    - -DLV_USE_IMAGE=1   # weather icons (A8 images)
    # Stock Montserrat sizes used by the Dialed design (English UI, ASCII + degree sign + LV_SYMBOL_*).
    # Size 14 is already enabled by ESPHome as the LVGL default font.
    - -DLV_FONT_MONTSERRAT_12=1
    - -DLV_FONT_MONTSERRAT_16=1
    - -DLV_FONT_MONTSERRAT_20=1
    - -DLV_FONT_MONTSERRAT_28=1
    - -DLV_FONT_MONTSERRAT_40=1
    - -DLV_FONT_MONTSERRAT_48=1

esp32:
  variant: esp32s3
  flash_mode: dio
  # StampS3 = ESP32-S3FN8: 8 MB flash, no PSRAM (M5Stack Dial docs). Changing this changes the
  # partition table: flash over USB once after changing it; OTA works again afterwards.
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret homedial__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: homedial Fallback Hotspot
    password: !secret homedial__ap_password

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [dial_ui]

packages:
  hardware: !include packages/hardware.yaml
  ha_entities: !include packages/ha_entities.yaml
  ui: !include packages/ui.yaml
